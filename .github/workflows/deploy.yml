# Build once without credentials, then deploy that same artifact to beta and,
# if that succeeds, to prod. Every real step is a script under scripts/ that
# runs the same on a laptop.
#
# Branches: main deploys beta and then prod. The one feature branch named in
# the trigger deploys the beta stage only: prod is skipped by the job
# condition below and, as the structural line, refused by the prod role's
# trust policy, which admits refs/heads/main alone. Remove that branch from
# the trigger in the pull request that merges it.
name: Deploy

on:
  push:
    branches: [main, mvp]
  workflow_dispatch:

permissions: {}

# One deploy at a time; a second push waits rather than racing the first.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build (no credentials)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.x"
          terraform_wrapper: false

      - name: Check infrastructure
        run: scripts/check-infra.sh

      - name: Typecheck and test
        run: scripts/test.sh

      - name: Build API
        run: scripts/build-api.sh

      - name: Build web
        run: scripts/build-web.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: dist/web
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api
          path: dist/api/api.zip
          if-no-files-found: error

  # Beta gets the artifacts first. Its folder is the beta stage at
  # preview.influencertrees.com; a failure here stops prod from running.
  deploy-beta:
    name: Deploy beta
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token the deploy role trusts
      contents: read
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET_BETA }}
      TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID_BETA }}
      TF_VAR_founder_email: ${{ vars.FOUNDER_EMAIL }}
    steps:
      # Source only: infra/ and scripts/. No dependency install happens in
      # this job; the site and the API were built above and arrive as
      # artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web
          path: dist/web

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api
          path: dist/api

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_BETA }}
          aws-region: us-east-1

      # A tool download from HashiCorp's release server, not a package install.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.x"
          terraform_wrapper: false

      - name: Apply infrastructure
        run: scripts/deploy-infra.sh beta

      - name: Deploy web
        run: scripts/deploy-web.sh beta beta

      - name: Smoke test
        run: scripts/smoke.sh https://preview.influencertrees.com

  deploy-prod:
    name: Deploy prod
    needs: [build, deploy-beta]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET_PROD }}
      TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID_PROD }}
      TF_VAR_founder_email: ${{ vars.FOUNDER_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web
          path: dist/web

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api
          path: dist/api

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.x"
          terraform_wrapper: false

      - name: Apply infrastructure
        run: scripts/deploy-infra.sh prod

      - name: Deploy web
        run: scripts/deploy-web.sh prod

      - name: Smoke test
        run: scripts/smoke.sh https://influencertrees.com
